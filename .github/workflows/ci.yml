name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Host build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Host build (x86_64-unknown-linux-gnu): the shared runtime and every
      # station crate, plus the debug `luna` binary used by integration tests.
      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer station detection
        run: python3 tests/install_detection.py

      - name: Read-only installation
        run: python3 tests/readonly_install.py

      - name: Media providers over HTTP
        run: python3 tests/media_provider_http.py target/debug/luna
