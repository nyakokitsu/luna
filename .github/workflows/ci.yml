name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: Host build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Host build (x86_64-unknown-linux-gnu): the shared runtime and every
      # station crate, plus the debug `luna` binary used by integration tests.
      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer station detection
        run: python3 tests/install_detection.py

      - name: Read-only installation
        run: python3 tests/readonly_install.py

      - name: Media providers over HTTP
        run: python3 tests/media_provider_http.py target/debug/luna

  web:
    name: Web UI syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pages keep their code in inline <script> blocks; extract it and
      # let Node parse it without running anything.
      - name: node --check
        run: |
          for page in web/*.html; do
            python3 - "$page" <<'PY' | node --check
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          print("\n;\n".join(re.findall(r"<script>(.*?)</script>", text, re.S)))
          PY
            echo "ok $page"
          done

  stations:
    name: Station list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          matrix=$(jq -c '[.devices[] | {device, target, binary, manifest_path}]' luna-manifest.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cross:
    name: Cross build (${{ matrix.device }})
    needs: stations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.stations.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.device }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Same target, manifest and binary as tools/build-deploy.sh, taken from
      # luna-manifest.json. Debug profile: this checks that the station
      # compiles and links for its musl target; release builds stay local.
      - name: cross build
        run: >-
          cross build --locked
          --target ${{ matrix.target }}
          --manifest-path ${{ matrix.manifest_path }}
          --bin ${{ matrix.binary }}
